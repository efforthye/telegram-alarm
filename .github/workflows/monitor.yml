name: alarm-monitor

# 시각은 UTC (한국시간 = UTC + 9)
# 수동 실행 전용 (정기 작업은 alarm-bot 이 담당)
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "monitor | commands | report-morning | report-stock | report-coin | test"
        default: monitor

concurrency:
  group: alarm-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 상태 가져오기
        run: bash scripts/state_restore.sh

      - name: 경로 연결 (로컬과 같은 폴더 구조)
        run: |
          mkdir -p ~/.claude/scheduled-tasks
          ln -s "$GITHUB_WORKSPACE/coin"    ~/.claude/scheduled-tasks/coin-true-scanner
          ln -s "$GITHUB_WORKSPACE/stock"   ~/.claude/scheduled-tasks/stock-true-scanner
          ln -s "$GITHUB_WORKSPACE/monitor" ~/.claude/scheduled-tasks/live-monitor

      - name: 실행
        run: |
          MODE="${{ github.event.inputs.mode }}"
          case "${{ github.event.schedule }}" in
            "30 23 * * 0-4") MODE=report-morning ;;
            "30 7 * * 1-5")  MODE=report-stock ;;
            "0 0 * * 0,6")   MODE=report-coin ;;
            "*/5 * * * *")   MODE=commands ;;
          esac
          MODE="${MODE:-monitor}"
          echo "mode=$MODE"
          case "$MODE" in
            report-stock) python3 -I monitor/monitor.py --report stock ;;
            report-coin)  python3 -I monitor/monitor.py --report coin ;;
            report-morning) python3 -I monitor/monitor.py --report morning ;;
            commands)     python3 -I monitor/monitor.py --commands ;;
            test)
              python3 -I -c '
          import os, re
          t, c = os.environ.get("TELEGRAM_BOT_TOKEN", ""), os.environ.get("TELEGRAM_CHAT_ID", "")
          print("token length:", len(t), "| 형식(숫자:35자):", bool(re.fullmatch(r"\d{6,12}:[A-Za-z0-9_-]{30,40}", t)),
                "| 앞뒤 공백/줄바꿈:", t != t.strip())
          print("chat id length:", len(c), "| 숫자만:", bool(re.fullmatch(r"-?\d{5,15}", c.strip())),
                "| 앞뒤 공백/줄바꿈:", c != c.strip())
          '
              python3 -I monitor/monitor.py --setup-menu ;;
            *)            python3 -I monitor/monitor.py ;;
          esac
          [ "$MODE" = commands ] || tail -5 monitor/monitor.log || true

      - name: 상태 저장
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/state_save.sh
